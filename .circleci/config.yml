version: 2.1

# Reusable executor to avoid duplication
executors:
  node-executor:
    docker:
      - image: cimg/node:22.22
    working_directory: ~/project

# Reusable commands to DRY up your config
commands:
  setup-pnpm:
    description: "Setup pnpm with caching"
    steps:
      - checkout
      - run:
          name: Verify Checked-out Revision
          command: |
            echo "CircleCI revision: ${CIRCLE_SHA1}"
            echo "Checked-out revision: $(git rev-parse HEAD)"
            git log -1 --oneline
            test "$(git rev-parse HEAD)" = "${CIRCLE_SHA1}"
      - run:
          name: Upgrade and Enable Corepack
          command: |
            sudo npm install -g corepack@latest
            sudo corepack enable
      - restore_cache:
          name: Restore pnpm Store Cache
          keys:
            - v3-pnpm-store-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install Dependencies
          command: pnpm install --frozen-lockfile --force
      - save_cache:
          name: Save pnpm Store Cache
          key: v3-pnpm-store-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: Verify Toolchain Versions
          command: |
            pnpm exec tsc --version
            pnpm exec node -p "require('typescript').version"
            pnpm list --depth 0 typescript typescript-eslint eslint

jobs:
  lint-and-typecheck:
    executor: node-executor
    steps:
      - setup-pnpm
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Type Check
          command: pnpm exec tsc --noEmit
      - run:
          name: Format Check
          command: pnpm format:check

  test:
    executor: node-executor
    steps:
      - setup-pnpm
      - run:
          name: Run Tests with Coverage
          command: pnpm test:coverage
          environment:
            NODE_ENV: test
      - store_artifacts:
          path: coverage
          destination: coverage-report
      # Optional: Upload to Codecov
      # - run:
      #     name: Upload Coverage
      #     command: npx codecov

  build:
    executor: node-executor
    steps:
      - setup-pnpm
      - run:
          name: Build Production Bundle
          command: pnpm build
      - run:
          name: Verify Build Output
          command: |
            ls -lh dist/
            du -sh dist/
            echo "Build size: $(du -sh dist/ | cut -f1)"
      - persist_to_workspace:
          root: .
          paths:
            - dist
            - package.json
            - pnpm-lock.yaml
      - store_artifacts:
          path: dist
          destination: build-artifacts

  # Sync built web assets into iOS & Android Capacitor projects
  # Runs only on pre-prod and main - keeps mobile bundles always current
  cap-sync:
    executor: node-executor
    steps:
      - setup-pnpm
      - run:
          name: Install Capacitor CLI
          command: pnpm exec cap --version || pnpm add -D @capacitor/cli
      - run:
          name: Build App Bundle (no website homepage or videos)
          command: pnpm build:app
      - run:
          name: Sync Web Assets to iOS
          command: npx cap sync ios
      - run:
          name: Sync Web Assets to Android
          command: npx cap sync android
      - store_artifacts:
          path: ios/App/App/public
          destination: ios-web-assets
      - store_artifacts:
          path: android/app/src/main/assets/public
          destination: android-web-assets

  # Optional: Bundle size analysis (install vite-bundle-visualizer to enable)
  analyze-bundle:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Upgrade and Enable Corepack
          command: |
            sudo npm install -g corepack@latest
            sudo corepack enable
      - restore_cache:
          name: Restore pnpm Store Cache
          keys:
            - v3-pnpm-store-{{ checksum "pnpm-lock.yaml" }}
      - run:
          name: Install Dependencies
          command: pnpm install --frozen-lockfile --force
      - run:
          name: Analyze Bundle Size
          command: |
            pnpm exec vite-bundle-visualizer || echo "Install vite-bundle-visualizer to enable: pnpm add -D vite-bundle-visualizer"
      - store_artifacts:
          path: stats.html
          destination: bundle-analysis

  # Security audit
  security-audit:
    executor: node-executor
    steps:
      - setup-pnpm
      - run:
          name: Security Audit
          command: pnpm audit --prod --audit-level=moderate

workflows:
  build-test-deploy:
    jobs:
      - lint-and-typecheck
      - security-audit
      - test:
          requires:
            - lint-and-typecheck
      - build:
          requires:
            - test
      - cap-sync:
          requires:
            - build
          filters:
            branches:
              only:
                - pre-prod
                - main
      - analyze-bundle:
          requires:
            - build
          filters:
            branches:
              only: main
