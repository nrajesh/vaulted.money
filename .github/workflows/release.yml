name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to upload assets to
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  electron-dmg:
    name: Electron DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build DMG
        run: pnpm run electron:build

      - name: Collect DMG
        run: |
          mkdir -p release-assets
          find release -type f -name "*.dmg" -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -name "*.dmg" -print -quit)"

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.dmg --clobber

  electron-windows:
    name: Electron Windows installer
    # Unsigned: Windows SmartScreen warns on first launch ("More info" > "Run anyway").
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers (x64 and Arm)
        run: pnpm run electron:build:win

      - name: Upload installers to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe)
          test ${#files[@]} -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  electron-linux:
    name: Electron Linux packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AppImage and .deb (x64 and arm64)
        run: pnpm run electron:build:linux

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.AppImage release/*.deb)
          test ${#files[@]} -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android release APK
        run: pnpm run android:build:apk:release

      - name: Collect APK
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/*.apk release-assets/
          for apk in release-assets/*.apk; do
            mv "$apk" "release-assets/vaulted-money-android-${apk##*/}"
          done

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.apk --clobber

  ios-simulator:
    name: iOS Simulator App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Xcode
        run: sudo xcodebuild -runFirstLaunch || true

      - name: Build iOS simulator app
        run: pnpm run ios:build:simulator

      - name: Collect iOS simulator app
        run: |
          mkdir -p release-assets
          IOS_APP="$(find ios/build/DerivedData/Build/Products/Release-iphonesimulator -maxdepth 1 -type d -name "*.app" -print -quit)"
          test -n "$IOS_APP"
          ditto -c -k --sequesterRsrc --keepParent "$IOS_APP" release-assets/vaulted-money-ios-simulator-app.zip

      - name: Upload iOS image to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/vaulted-money-ios-simulator-app.zip --clobber

  claude-desktop-extension:
    name: Claude Desktop extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Claude Desktop extension
        run: node scripts/build-mcpb.mjs

      - name: Verify extension bundle
        run: test -s release/extension/vaulted-money.mcpb

      - name: Upload extension to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release/extension/vaulted-money.mcpb --clobber

  store-screenshots:
    name: Store screenshots
    # macOS: the app uses the system font, which Linux runners lack.
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix marketing
          npx --prefix marketing playwright install chromium

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Make every store image
        run: pnpm marketing:screenshots --set all

      - name: Upload store screenshots to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd marketing/store-screenshots/out
          zip -qr ../vaulted-money-store-screenshots.zip . -x 'captures/*'
          gh release upload "$RELEASE_TAG" ../vaulted-money-store-screenshots.zip --clobber
