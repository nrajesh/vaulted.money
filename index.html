<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!--
    The build uses relative asset URLs (base "./") so the same output works
    under Electron's file:// protocol. On http(s) with path routing, a deep link
    such as /reports/essential would then request /reports/assets/*.js, receive
    the SPA fallback HTML and render a blank page. Pin the document base to the
    site root there. This must stay before any other URL-bearing tag.
  -->
  <script>
    if (/^https?:$/.test(location.protocol)) {
      document.write('<base href="/">');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme -->
  <meta name="theme-color" content="#0d1520" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

  <!-- Primary meta -->
  <title>Vaulted Money — private, local-first personal finance (open source)</title>
  <meta name="description" content="Free, open-source budgeting and expense tracking that runs on your device. No account, no cloud. Search your ledger in plain English, import bank CSVs, set budgets and keep encrypted backups." />
  <link rel="canonical" href="https://vaulted.money/" />

  <!-- Open Graph. Image and URL must be absolute: link previews do not
       resolve relative paths. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vaulted Money" />
  <meta property="og:url" content="https://vaulted.money/" />
  <meta property="og:title" content="Vaulted Money — ask your ledger, keep control" />
  <meta property="og:description" content="Private, local-first money tracking. No account. Open source. Plain-English search that needs no AI or cloud." />
  <meta property="og:image" content="https://vaulted.money/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Vaulted Money: Ask your ledger. Keep control. Private, local-first personal finance." />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Vaulted Money — ask your ledger, keep control" />
  <meta name="twitter:description" content="Private, local-first money tracking. No account. Open source. Plain-English search that needs no AI or cloud." />
  <meta name="twitter:image" content="https://vaulted.money/og-image.png" />

  <!-- Structured data for search engines -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Vaulted Money",
      "url": "https://vaulted.money/",
      "image": "https://vaulted.money/og-image.png",
      "description": "Private, local-first personal finance app. Track spending, import bank CSV exports, set budgets, run reports and search your ledger in plain English. No account; data stays on your device.",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web, Windows, macOS, Linux, Android, iOS",
      "isAccessibleForFree": true,
      "license": "https://opensource.org/licenses/MIT",
      "codeRepository": "https://github.com/nrajesh/vaulted.money",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "featureList": [
        "Plain-English ledger search without AI or cloud",
        "Multiple ledgers and multi-currency balances",
        "Bank CSV import",
        "Budgets, reports and analytics",
        "Encrypted backups",
        "Works offline, no account",
        "Desktop Local API and MCP agent connection"
      ]
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <!-- Read by crawlers and previewers that do not run JavaScript. -->
  <noscript>
    <h1>Vaulted Money — private, local-first personal finance</h1>
    <p>Vaulted Money is a free, open-source app for tracking income, spending, accounts and budgets. It runs on your own device: no account, no cloud, and it works offline. Search your ledger in plain English ("groceries over 50 last month") without AI, import bank CSV exports, keep separate ledgers in multiple currencies, and export encrypted backups. Available for the web, desktop (Windows, macOS, Linux), Android and iOS.</p>
    <p><a href="https://vaulted.money/ledgers?demo=1">Try it with demo data</a> · <a href="https://github.com/nrajesh/vaulted.money">Source code on GitHub (MIT)</a> · <a href="https://vaulted.money/privacy">Privacy</a></p>
    <p>The app itself needs JavaScript enabled.</p>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
